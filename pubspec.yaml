name: supa_manager
description: This package makes it easy to use the supabase database. It provides generic methods for performing CRUD operations (Create, Read, Update and Delete).
version: 1.0.3
repository: https://github.com/kevindmoore/supa_manager
homepage: https://github.com/kevindmoore/supa_manager

environment:
  sdk: '>=3.7.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.5
  lumberdash: ^3.0.0
  colorize_lumberdash: ^3.0.0
  supabase_flutter: ^2.15.0
  gotrue: ^2.22.0
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed:
  build_runner: ^2.15.0
  json_serializable: ^6.14.0
  # Supabase depends on 3.0.0
  lints: ^6.1.0
